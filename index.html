<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Edrell Engineering AB</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* Innehåll på vänster sida */
    .content {
      padding: 50px;
      flex: 1;
    }

    .content h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .content p {
      font-size: 18px;
      line-height: 1.6;
    }

    /* Logotyp längs högersidan */
.logo-side {
  position: fixed;
  top: 50%;
  right: 20px;
  transform: translateY(-50%);
}

.logo-side img {
  height: 120px;
  transform: rotate(90deg);
}

    /* Responsivt */
    @media (max-width: 768px) {
      .logo-side {
        display: none; /* Dölj logotyp på små skärmar */
      }
    }
  </style>
</head>
<body>

  <div class="content">
    <h1>Välkommen till Jennifer Friberg Edrells sida!</h1>
    <p>
      Detta är min testhemsida. Här ska jag visa upp mina tjänster, produkter och kontaktinformation.
    </p>
  
  </div>

  <div class="logo-side">
    <img src="logotype01.jpg" alt="Logotyp">
  </div>

</body>
</html>
